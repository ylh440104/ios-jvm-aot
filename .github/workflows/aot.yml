name: aot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install LLVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm clang
          llvm-as --version | head -3

      - name: Build compiler
        run: mvn -B -q package

      - name: Compile test classes
        run: |
          mkdir -p build/classes
          javac -d build/classes testdata/*.java
          javap -v -cp build/classes Hello | grep -E 'major|minor'

      - name: Emit LLVM IR
        run: |
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Hello -o build/hello.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry ObjTest -o build/obj.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry ArraysTest -o build/arr.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry StaticsTest -o build/st.ll

      - name: Verify IR is well formed
        run: |
          llvm-as build/hello.ll -o build/hello.bc
          llvm-as build/obj.ll -o build/obj.bc
          llvm-as build/arr.ll -o build/arr.bc
          llvm-as build/st.ll -o build/st.bc
          echo IR_VERIFY_OK

      - name: Execute IR with lli
        run: |
          lli build/hello.bc > build/hello.txt
          printf 'hello from java 21 bytecode\n42\n110\n42\n' > build/hello.expected
          diff build/hello.expected build/hello.txt && echo HELLO_OK
          lli build/obj.bc > build/obj.txt
          printf '7\n14\n25\n49\n1\n' > build/obj.expected
          diff build/obj.expected build/obj.txt && echo OBJECTS_OK
          lli build/arr.bc > build/arr.txt
          printf '30\n5\n0\n42\n2\n' > build/arr.expected
          diff build/arr.expected build/arr.txt && echo ARRAYS_OK
          lli build/st.bc > build/st.txt
          printf '7\n12\n48\n212\n' > build/st.expected
          diff build/st.expected build/st.txt && echo STATICS_OK

      - name: Compile with clang
        run: |
          for t in hello obj arr; do
            clang -O1 build/$t.ll -o build/$t-bin
            ./build/$t-bin
          done

  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build compiler
        run: mvn -B -q package

      - name: Compile test classes
        run: |
          mkdir -p build/classes
          javac -d build/classes testdata/*.java

      - name: Emit LLVM IR
        run: java -jar target/ios-jvm-aot.jar -cp build/classes -o build/out.ll

      - name: Link for iOS simulator
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun --sdk iphonesimulator clang -O1 \
            -target arm64-apple-ios16.0-simulator \
            -isysroot "$SDK" build/out.ll -o build/hello-sim
          file build/hello-sim

      - name: Build iOS device object
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -O1 -c \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDK" build/out.ll -o build/hello-device.o
          file build/hello-device.o
          lipo -info build/hello-device.o

      - uses: actions/upload-artifact@v4
        with:
          name: ios-objects
          path: |
            build/out.ll
            build/hello-sim
            build/hello-device.o