name: aot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install LLVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm clang
          llvm-as --version | head -3

      - name: Build compiler
        run: mvn -B -q package

      - name: Compile test classes
        run: |
          mkdir -p build/classes
          javac -d build/classes testdata/*.java
          javap -v -cp build/classes Hello | grep -E 'major|minor'

      - name: Emit LLVM IR
        run: |
          java -jar target/ios-jvm-aot.jar -cp build/classes -o build/out.ll
          echo '--- head of IR ---'
          head -30 build/out.ll

      - name: Verify IR is well formed
        run: |
          llvm-as build/out.ll -o build/out.bc
          echo IR_VERIFY_OK

      - name: Execute IR with lli
        run: |
          lli build/out.bc | tee build/actual.txt
          printf 'hello from java 21 bytecode\n42\n110\n42\n' > build/expected.txt
          echo '--- diff ---'
          diff build/expected.txt build/actual.txt && echo SEMANTICS_OK

      - name: Compile with clang
        run: |
          clang -O1 build/out.ll -o build/hello
          ./build/hello

  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build compiler
        run: mvn -B -q package

      - name: Compile test classes
        run: |
          mkdir -p build/classes
          javac -d build/classes testdata/*.java

      - name: Emit LLVM IR
        run: java -jar target/ios-jvm-aot.jar -cp build/classes -o build/out.ll

      - name: Link for iOS simulator
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun --sdk iphonesimulator clang -O1 \
            -target arm64-apple-ios16.0-simulator \
            -isysroot "$SDK" build/out.ll -o build/hello-sim
          file build/hello-sim

      - name: Build iOS device object
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -O1 -c \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDK" build/out.ll -o build/hello-device.o
          file build/hello-device.o
          lipo -info build/hello-device.o

      - uses: actions/upload-artifact@v4
        with:
          name: ios-objects
          path: |
            build/out.ll
            build/hello-sim
            build/hello-device.o