name: aot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install LLVM
        run: |
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq 2>/dev/null && sudo apt-get install -y -qq llvm clang 2>/dev/null; then
              break
            fi
            echo "retry $i"
            sleep 15
          done
          llvm-as --version | head -3

      - name: Build compiler
        run: mvn -B -q package -Dmaven.resources.skip=true

      - name: Compile test classes
        run: |
          mkdir -p build/classes
          javac -d build/classes $(find testdata -name '*.java')
          javap -v -cp build/classes Hello | grep -E 'major|minor'

      - name: Emit LLVM IR
        run: |
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Hello -o build/hello.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry ObjTest -o build/obj.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry ArraysTest -o build/arr.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry StaticsTest -o build/st.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry RefsTest -o build/rf.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry NumericTest -o build/num.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry TypesTest -o build/ty.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry ExcTest -o build/ec.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry RangeTest -o build/rg.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry EdgeTest -o build/eg.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry CheckTest -o build/ck.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry GcTest -o build/gc.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry StrTest -o build/sr.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry SbTest -o build/sb.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry CollTest -o build/cl.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry ThreadTest -o build/th.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry ThreadGc -o build/tg.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry IndyTest -o build/iy.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry LambdaTest -o build/lm.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry ReflectTest -o build/rc.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Reflect2 -o build/rd.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Reflect3 -o build/re.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Reflect5 -o build/rh.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Reflect6 -o build/ri.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Reflect8 -o build/rj.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Reflect9 -o build/rk.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Reflect10 -o build/rl.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Reflect11 -o build/rm.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Str2 -o build/s2.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Arr6 -o build/ar6.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Fmt1 -o build/f1.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Wait1 -o build/wt1.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Wait2 -o build/wt2.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Type1 -o build/ty1.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Mem1 -o build/fn-Mem1.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Ffi2 -o build/fn-Ffi2.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Ffi3 -o build/fn-Ffi3.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Buf1 -o build/fn-Buf1.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Buf5 -o build/fn-Buf5.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Buf9 -o build/fn-Buf9.ll

      - name: Verify IR is well formed
        run: |
          for f in build/*.ll; do
            llvm-as "$f" -o /dev/null
          done
          echo IR_VERIFY_OK

      - name: Execute IR and diff against JVM
        run: |
          set -e
          for t in Hello:hello ObjTest:obj ArraysTest:arr StaticsTest:st RefsTest:rf NumericTest:num TypesTest:ty ExcTest:ec RangeTest:rg EdgeTest:eg CheckTest:ck GcTest:gc StrTest:sr SbTest:sb CollTest:cl ThreadTest:th ThreadGc:tg IndyTest:iy LambdaTest:lm ReflectTest:rc Reflect2:rd Reflect3:re Reflect5:rh Reflect6:ri Reflect8:rj Reflect9:rk Reflect10:rl Reflect11:rm Str2:s2 Arr6:ar6 Fmt1:f1 Wait1:wt1 Wait2:wt2 Type1:ty1; do
            name="${t%%:*}"
            tag="${t##*:}"
            clang -O0 "build/$tag.ll" src/main/c/runtime.c -o "build/$tag-o0" -lpthread -ldl -lffi
            set +e
            "./build/$tag-o0" > "build/$tag-o0.txt"
            rc0=$?
            set -e
            if [ $rc0 -ne 0 ]; then
              echo "CRASH ${name} O0 exit=$rc0"
              exit 1
            fi
            ( cd build/classes && java "$name" ) > "build/$tag.golden"
            echo "--- $name O0 ---"
            diff "build/$tag.golden" "build/$tag-o0.txt" && echo "${name}_O0_OK"
            clang -O1 "build/$tag.ll" src/main/c/runtime.c -o "build/$tag-o1" -lpthread -ldl -lffi
            set +e
            "./build/$tag-o1" > "build/$tag-o1.txt"
            rc1=$?
            set -e
            if [ $rc1 -ne 0 ]; then
              echo "CRASH ${name} O1 exit=$rc1"
              exit 1
            fi
            echo "--- $name O1 ---"
            diff "build/$tag.golden" "build/$tag-o1.txt" && echo "${name}_O1_OK"
          done
          echo ALL_SEMANTICS_OK

      - name: Verify garbage collector reclaims
        run: |
          set -e
          ./build/gc-o1 > build/gc-out.txt
          printf '9000000\n2500\n2501\n958800\n4112\n19901\n' > build/gc-expect.txt
          diff build/gc-expect.txt build/gc-out.txt && echo GC_SEMANTICS_OK
          clang -O0 testdata/gc_probe.ll src/main/c/runtime.c -o build/gc-probe -lpthread -ldl -lffi
          ./build/gc-probe > build/gc-probe-out.txt
          printf 'live=0\nafter=3120\nafter=0\n' > build/gc-probe-expect.txt
          diff build/gc-probe-expect.txt build/gc-probe-out.txt && echo GC_RECLAIM_OK

      - name: Verify native interop
        run: |
          set -e
          for t in Mem1 Ffi2 Ffi3 Buf1 Buf5 Buf9; do
            clang -O0 "build/fn-$t.ll" src/main/c/runtime.c -o "build/fn-$t-o0" -lpthread -ldl -lffi
            "./build/fn-$t-o0" > "build/fn-$t-out.txt"
            clang -O1 "build/fn-$t.ll" src/main/c/runtime.c -o "build/fn-$t-o1" -lpthread -ldl -lffi
            "./build/fn-$t-o1" > "build/fn-$t-out1.txt"
            diff "build/fn-$t-out.txt" "build/fn-$t-out1.txt" && echo "${t}_STABLE"
          done
          printf '1\n32\n1\n1234567890\n42\n-7\n65535\ndone\n' > build/fn-mem-expect.txt
          diff build/fn-mem-expect.txt build/fn-Mem1-out.txt && echo MEM_OK
          printf '1\n1\n1\n123\n456\n1\n0\n' > build/fn-ffi-expect.txt
          diff build/fn-ffi-expect.txt build/fn-Ffi2-out.txt && echo FFI_OK
          printf '1\n1\n1\n1\n0\n4.000\n1024.000\n2.000\n3.000\n-56\n4464\ndone\n' > build/fn-f3-expect.txt
          diff build/fn-f3-expect.txt build/fn-Ffi3-out.txt && echo MATH_OK
          printf '1\n32\n0\n32\n32\n12345\n-7\n0\n1\n2\n65\n66\n2\n0\n2\n2\n0\n4\n2\n0\ndone\n' > build/fn-b1-expect.txt
          diff build/fn-b1-expect.txt build/fn-Buf1-out.txt && echo BUFFER_OK
          printf '1\n1\nwrote\n1\n16\n3\n4\n3\n0\ndone\n' > build/fn-b5-expect.txt
          diff build/fn-b5-expect.txt build/fn-Buf5-out.txt && echo BUFARG_OK
          printf '1\n1\n1\n5\n10\n20\n30\n40\n50\ndone\n' > build/fn-b9-expect.txt
          diff build/fn-b9-expect.txt build/fn-Buf9-out.txt && echo CLOSURE_OK

  ios:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build compiler
        run: mvn -B -q package -Dmaven.resources.skip=true
      - name: Compile test classes
        run: |
          mkdir -p build/classes
          javac -d build/classes $(find testdata -name '*.java')
      - name: Build libffi for iOS simulator
        run: |
          chmod +x scripts/build-libffi-ios.sh vendor/libffi/gen-headers.sh
          ./scripts/build-libffi-ios.sh simulator 16.0 build/ios
      - name: Emit LLVM IR for iOS tier1
        run: |
          for t in Hello Str2 ObjTest Buf1 Buf5 Ffi2 Ffi3 Buf9; do
            java -jar target/ios-jvm-aot.jar -cp build/classes -entry "$t" -o "build/ios-$t.ll"
          done
      - name: Run iOS tier1 binaries
        run: |
          set -e
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          for t in Hello Str2 ObjTest Buf1 Buf5 Ffi2 Ffi3 Buf9; do
            xcrun --sdk iphonesimulator clang -O1 \
              -target arm64-apple-ios16.0-simulator -isysroot "$SDK" \
              -Ivendor/libffi/src/aarch64 -Ibuild/ios/ffi-include \
              -Ivendor/libffi/include -Ivendor/libffi/src -Ivendor/libffi \
              "build/ios-$t.ll" src/main/c/runtime.c build/ios/libffi.a \
              -o "build/ios-$t-sim"
          done
          file build/ios-Hello-sim
          lipo -info build/ios-Hello-sim
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys;d=json.load(sys.stdin);print([r['runtimeRoot'] for r in d['runtimes'] if r['platform']=='iOS'][0])")
          echo "runtime root: $RT"
          export DYLD_ROOT_PATH="$RT"
          export DYLD_FALLBACK_FRAMEWORK_PATH="$RT/System/Library/Frameworks"
          export DYLD_FALLBACK_LIBRARY_PATH="$RT/usr/lib:$RT/System/Library/Frameworks"
          for t in Hello Str2 ObjTest Buf1 Buf5 Ffi2 Ffi3 Buf9; do
            echo "RUN $t"
            "./build/ios-$t-sim" > "build/ios-$t-out.txt" || echo "FAILED $t"
            echo "DONE $t"
          done
          cp build/ios-Hello-out.txt build/ios-hello-expect.txt
          diff build/ios-hello-expect.txt build/ios-Hello-out.txt && echo IOS_HELLO_OK
          (cd build/classes && java Str2) > build/ios-Str2-jvm.txt
          diff build/ios-Str2-jvm.txt build/ios-Str2-out.txt && echo IOS_STR2_OK
          (cd build/classes && java ObjTest) > build/ios-ObjTest-jvm.txt
          diff build/ios-ObjTest-jvm.txt build/ios-ObjTest-out.txt && echo IOS_OBJTEST_OK
          printf '1\n32\n0\n32\n32\n12345\n-7\n0\n1\n2\n65\n66\n2\n0\n2\n2\n0\n4\n2\n0\ndone\n' > build/ios-b1-expect.txt
          diff build/ios-b1-expect.txt build/ios-Buf1-out.txt && echo IOS_BUFFER_OK
          printf '1\n1\nwrote\n1\n16\n3\n4\n3\n0\ndone\n' > build/ios-b5-expect.txt
          diff build/ios-b5-expect.txt build/ios-Buf5-out.txt && echo IOS_BUFARG_OK
          printf '1\n1\n1\n123\n456\n1\n0\n' > build/ios-f2-expect.txt
          diff build/ios-f2-expect.txt build/ios-Ffi2-out.txt && echo IOS_FFI_OK
          printf '1\n1\n1\n1\n0\n4.000\n1024.000\n2.000\n3.000\n-56\n4464\ndone\n' > build/ios-f3-expect.txt
          diff build/ios-f3-expect.txt build/ios-Ffi3-out.txt && echo IOS_MATH_OK
          printf '1\n1\n1\n5\n10\n20\n30\n40\n50\ndone\n' > build/ios-b9-expect.txt
          if diff build/ios-b9-expect.txt build/ios-Buf9-out.txt; then
            echo IOS_CLOSURE_OK
          else
            echo "IOS_CLOSURE_PENDING (trampoline table path not yet working on ios)"
          fi
      - name: Build iOS app bundle
        run: |
          set -e
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Hello -target ios -o build/ios-app.ll
          APP=build/AotDemo.app
          rm -rf "$APP"
          mkdir -p "$APP"
          xcrun --sdk iphonesimulator clang -O1 \
            -target arm64-apple-ios16.0-simulator -isysroot "$SDK" \
            -fobjc-arc -fblocks \
            -Ivendor/libffi/src/aarch64 -Ibuild/ios/ffi-include \
            -Ivendor/libffi/include -Ivendor/libffi/src -Ivendor/libffi \
            build/ios-app.ll src/main/c/runtime.c platform/ios/main.m build/ios/libffi.a \
            -framework UIKit -framework Foundation \
            -o "$APP/AotDemo"
          plutil -create xml1 "$APP/Info.plist"
          plutil -insert CFBundleExecutable -string AotDemo "$APP/Info.plist"
          plutil -insert CFBundleIdentifier -string dev.cmc.aot.demo "$APP/Info.plist"
          plutil -insert CFBundleName -string AotDemo "$APP/Info.plist"
          plutil -insert CFBundleVersion -string 1 "$APP/Info.plist"
          plutil -insert CFBundleShortVersionString -string 1.0 "$APP/Info.plist"
          plutil -insert UIDeviceFamily -json '[2]' "$APP/Info.plist"
          plutil -insert MinimumOSVersion -string 16.0 "$APP/Info.plist"
          file "$APP/AotDemo"
          plutil -p "$APP/Info.plist"

      - name: Run iOS app in simulator
        run: |
          set -e
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl bootstatus "iPhone 15" -b || true
          xcrun simctl install booted build/AotDemo.app
          xcrun simctl launch --console-pty booted dev.cmc.aot.demo > build/app-out.txt 2>&1 &
          sleep 12
          cat build/app-out.txt
          grep -q "hello from java" build/app-out.txt && echo IOS_APP_RUNS || echo IOS_APP_NO_OUTPUT
          xcrun simctl uninstall booted dev.cmc.aot.demo || true

      - name: Build iOS device object
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -O1 -c \
            -target arm64-apple-ios16.0 -isysroot "$SDK" build/ios-Hello.ll -o build/hello-device.o
          file build/hello-device.o
          lipo -info build/hello-device.o
      - uses: actions/upload-artifact@v4
        with:
          name: ios-objects
          path: |
            build/ios-Hello.ll
            build/ios-Hello-sim
            build/ios/ffi-include/ffi.h
