name: aot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install LLVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm clang
          llvm-as --version | head -3

      - name: Build compiler
        run: mvn -B -q package

      - name: Compile test classes
        run: |
          mkdir -p build/classes
          javac -d build/classes testdata/*.java
          javap -v -cp build/classes Hello | grep -E 'major|minor'

      - name: Emit LLVM IR
        run: |
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry Hello -o build/hello.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry ObjTest -o build/obj.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry ArraysTest -o build/arr.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry StaticsTest -o build/st.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry RefsTest -o build/rf.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry NumericTest -o build/num.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry TypesTest -o build/ty.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry ExcTest -o build/ec.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry RangeTest -o build/rg.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry EdgeTest -o build/eg.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry CheckTest -o build/ck.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry GcTest -o build/gc.ll
          java -jar target/ios-jvm-aot.jar -cp build/classes -entry StrTest -o build/sr.ll

      - name: Verify IR is well formed
        run: |
          for f in build/*.ll; do
            llvm-as "$f" -o /dev/null
          done
          echo IR_VERIFY_OK

      - name: Execute IR and diff against JVM
        run: |
          set -e
          for t in Hello:hello ObjTest:obj ArraysTest:arr StaticsTest:st RefsTest:rf NumericTest:num TypesTest:ty ExcTest:ec RangeTest:rg EdgeTest:eg CheckTest:ck GcTest:gc StrTest:sr; do
            name="${t%%:*}"
            tag="${t##*:}"
            clang -O0 "build/$tag.ll" src/main/c/runtime.c -o "build/$tag-o0"
            "./build/$tag-o0" > "build/$tag-o0.txt"
            ( cd build/classes && java "$name" ) > "build/$tag.golden"
            echo "--- $name O0 ---"
            diff "build/$tag.golden" "build/$tag-o0.txt" && echo "${name}_O0_OK"
            clang -O1 "build/$tag.ll" src/main/c/runtime.c -o "build/$tag-o1"
            "./build/$tag-o1" > "build/$tag-o1.txt"
            echo "--- $name O1 ---"
            diff "build/$tag.golden" "build/$tag-o1.txt" && echo "${name}_O1_OK"
          done
          echo ALL_SEMANTICS_OK

      - name: Verify garbage collector reclaims
        run: |
          set -e
          ./build/gc-o1 > build/gc-out.txt
          printf '9000000\n2500\n2501\n958800\n4112\n19901\n' > build/gc-expect.txt
          diff build/gc-expect.txt build/gc-out.txt && echo GC_SEMANTICS_OK
          clang -O0 testdata/gc_probe.ll src/main/c/runtime.c -o build/gc-probe
          ./build/gc-probe > build/gc-probe-out.txt
          printf 'live=0\nafter=3120\nafter=0\n' > build/gc-probe-expect.txt
          diff build/gc-probe-expect.txt build/gc-probe-out.txt && echo GC_RECLAIM_OK

  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build compiler
        run: mvn -B -q package

      - name: Compile test classes
        run: |
          mkdir -p build/classes
          javac -d build/classes testdata/*.java

      - name: Emit LLVM IR
        run: java -jar target/ios-jvm-aot.jar -cp build/classes -entry Hello -o build/out.ll

      - name: Link for iOS simulator
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun --sdk iphonesimulator clang -O1 \
            -target arm64-apple-ios16.0-simulator \
            -isysroot "$SDK" build/out.ll -o build/hello-sim
          file build/hello-sim

      - name: Build iOS device object
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -O1 -c \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDK" build/out.ll -o build/hello-device.o
          file build/hello-device.o
          lipo -info build/hello-device.o

      - uses: actions/upload-artifact@v4
        with:
          name: ios-objects
          path: |
            build/out.ll
            build/hello-sim
            build/hello-device.o